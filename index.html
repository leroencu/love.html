# love.html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .small-text {
            position: absolute;
            color: #ff1a1a;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 4px rgba(255, 0, 0, 0.9), 0 0 10px rgba(255, 0, 0, 0.4);
            filter: blur(0.5px);
            transition: opacity 0.3s ease-in-out;
        }

        .center-text {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 50px;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            white-space: nowrap;
            z-index: 100;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 25px rgba(255, 255, 255, 0.4);
            filter: blur(0.8px);
            transition: opacity 1.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="center-text" class="center-text">I love you</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const centerTextEl = document.getElementById('center-text');

        // Используем vw/vh для адаптации под любой экран
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

        // Центр экрана
        const centerX = vw / 2;
        const centerY = vh / 2;

        // Масштаб сердца — зависит от размера экрана
        const scale = Math.min(vw, vh) / 30;

        const points = [];
        const elements = [];

        // Формула сердца (контур)
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x, y };
        }

        // Собираем точки по контуру (плотно, чтобы не было промежутков)
        const totalPoints = 400; 
        for (let i = 0; i < totalPoints; i++) {
            let t = (i / totalPoints) * Math.PI * 2;
            let { x, y } = getHeartPoint(t);
            
            let posX = centerX + x * scale;
            let posY = centerY - y * scale; // Инвертируем Y

            points.push({ x: posX, y: posY, t: t });
        }

        // Сортируем по углу t — чтобы надписи появлялись последовательно по контуру
        // Начинаем с верхней точки (t = 0 соответствует верхней "впадинке" сердца)
        points.sort((a, b) => a.t - b.t);

        // Создаём надписи с задержкой
        const totalTime = 15000; // 15 секунд
        const delayPerPoint = totalTime / points.length;

        points.forEach((p, index) => {
            const span = document.createElement('span');
            span.className = 'small-text';
            span.innerText = 'I love you';

            span.style.left = p.x + 'px';
            span.style.top = p.y + 'px';

            // Задержка появления
            const delay = index * (delayPerPoint / 1000);
            span.style.transitionDelay = delay + 's';

            container.appendChild(span);
            elements.push(span);
        });

        // Белая надпись в центре сердца
        centerTextEl.style.left = centerX + 'px';
        centerTextEl.style.top = (centerY - 30) + 'px';

        // Запуск появления красных надписей
        setTimeout(() => {
            elements.forEach(el => {
                el.style.opacity = '1';
            });
        }, 100);

        // Через 15 секунд — белая надпись
        setTimeout(() => {
            centerTextEl.style.opacity = '1';
        }, 15000);
    </script>
</body>
</html>
